<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfrOSINT BLACKSITE</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#030506;color:#a8bdc3;font:13px system-ui}#stage{position:fixed;inset:0;touch-action:none}header{position:fixed;top:24px;left:25px;pointer-events:none}h1{font-size:17px;letter-spacing:.22em;color:#d1dadd;margin:0}header p{font-size:11px;letter-spacing:.16em;color:#67858d}aside{position:fixed;bottom:22px;left:25px;padding:14px;background:#080d0fe8;border:1px solid #273b40;border-radius:5px;max-width:calc(100vw - 50px)}button{background:#132024;border:1px solid #334b50;color:#b8c9cd;padding:8px 12px;margin:10px 6px 0 0;cursor:pointer}#card{display:none;position:fixed;right:25px;top:40%;background:#0b1012f2;border:1px solid #354b50;padding:18px;width:240px}#card h2{font-size:16px;letter-spacing:.12em}#card p{line-height:1.6}#close{float:right;margin:0}#error{color:#d99;font-size:11px}#searchbox{position:fixed;top:115px;left:25px;z-index:5;background:#080d0fe8;border:1px solid #273b40;padding:12px;width:min(320px,calc(100vw - 50px))}#searchbox label{display:block;font-size:10px;letter-spacing:.15em;margin-bottom:7px}#country{width:100%;background:#0d191c;border:1px solid #344b50;color:#c4d7dc;padding:9px}#go{margin-top:8px}#back{margin-left:6px}#zoomlevel{display:block;color:#779aa2;font-size:10px;letter-spacing:.1em;margin-top:8px}#tooltip{display:none;position:fixed;pointer-events:none;background:#0b1215e8;border:1px solid #46646b;padding:7px 10px;font-size:11px;z-index:7}#card small{display:block;color:#779aa2;letter-spacing:.12em;margin:10px 0}#card{z-index:6}footer{position:fixed;right:22px;bottom:20px;color:#567078;font-size:10px;letter-spacing:.1em}@media(max-width:650px){#searchbox{top:93px;left:14px;width:245px}header{left:14px;top:14px}aside{left:14px;bottom:14px}#card{top:auto;bottom:120px;right:14px}footer{display:none}}</style></head><body><div id="stage"></div><header><h1>AFROSINT / BLACKSITE</h1><p>GEOSPATIAL NETWORK · DEMONSTRATION</p></header><div id="searchbox"><label for="country">COUNTRY INTELLIGENCE SEARCH</label><input id="country" list="countries" placeholder="Search country…" autocomplete="off"><datalist id="countries"></datalist><button id="go">ZOOM TO COUNTRY</button><button id="back">BACK TO GLOBE</button><span id="zoomlevel">VIEW: GLOBAL</span></div><div id="tooltip" role="status"></div><aside><div id="status">Drag to rotate · Scroll to zoom · Select a location</div><div id="error" role="alert"></div><button id="reset">FOCUS AFRICA</button><button id="spin">PAUSE ROTATION</button></aside><section id="card"><button id="close">×</button><h2 id="place"></h2><small id="coords"></small><p id="detail"></p></section><footer>BLACKSITE · DIGITAL EARTH · DEMO DATA</footer>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),error=document.querySelector('#error'),card=document.querySelector('#card');
try{
const scene=new T.Scene();scene.background=new T.Color(0x030506);
const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.z=4.6;
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);stage.appendChild(renderer.domElement);
const globe=new T.Group();scene.add(globe);const tooltip=document.querySelector('#tooltip'),input=document.querySelector('#country');const countryIndex=new Map();let flight=null,selected=null,outline=null,zoomedCountry=null;const level=document.querySelector('#zoomlevel');
function geo(lat,lon,r=1){let a=lat*Math.PI/180,b=lon*Math.PI/180;return new T.Vector3(-r*Math.cos(a)*Math.cos(b),r*Math.sin(a),r*Math.cos(a)*Math.sin(b))}
globe.add(new T.LineSegments(new T.WireframeGeometry(new T.IcosahedronGeometry(1.13,2)),new T.LineBasicMaterial({color:0x3a5860,transparent:true,opacity:.27})));
globe.add(new T.Mesh(new T.SphereGeometry(.997,48,32),new T.MeshBasicMaterial({color:0x071014,transparent:true,opacity:.35,depthWrite:false})));
function dots(arr){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(arr,3));globe.add(new T.Points(g,new T.PointsMaterial({color:0x729da6,size:.013,transparent:true,opacity:.85,depthWrite:false})))}
async function land(){const res=await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');if(!res.ok)throw Error('Map data unavailable');const json=await res.json(),canvas=document.createElement('canvas');canvas.width=1440;canvas.height=720;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.fillStyle='white';for(const f of json.features){const g=f.geometry;const name=f.properties?.ADMIN||f.properties?.name||f.properties?.NAME;const multi=g?.type==='MultiPolygon'?g.coordinates:g?.type==='Polygon'?[g.coordinates]:[];const rings=multi.map(p=>p[0]).filter(r=>r?.length);if(name&&rings.length){const ring=rings.reduce((a,b)=>a.length>b.length?a:b);const xs=ring.map(p=>p[0]),ys=ring.map(p=>p[1]);const lon=(Math.min(...xs)+Math.max(...xs))/2,lat=(Math.min(...ys)+Math.max(...ys))/2;countryIndex.set(name.toLowerCase(),{name,lat,lon,rings:multi.map(p=>p[0]).filter(r=>r?.length),extent:{latMin:Math.min(...ys),latMax:Math.max(...ys),lonMin:Math.min(...xs),lonMax:Math.max(...xs)}});} if(!g)continue;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of polys){ctx.beginPath();for(const ring of poly){ring.forEach(([lon,lat],i)=>{let x=(lon+180)*4,y=(90-lat)*4;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}ctx.fill('evenodd')}}const pix=ctx.getImageData(0,0,1440,720).data,arr=[];for(let y=4;y<716;y+=4)for(let x=4;x<1436;x+=4){if(pix[(y*1440+x)*4+3]<120)continue;const p=geo(90-y/4,x/4-180,1.005);arr.push(p.x,p.y,p.z)}dots(arr);populateCountries();status.textContent='Land network ready · Drag to rotate · Select a location'}
land().catch(e=>{error.textContent='Map source unavailable; displaying fallback network';console.warn(e);const a=[];for(let lat=-88;lat<=88;lat+=4)for(let lon=-180;lon<180;lon+=4){const p=geo(lat,lon,1.005);a.push(p.x,p.y,p.z)}dots(a)});
const demoCountries=[['Nigeria',9.1,8.7],['Ghana',7.9,-1.0],['Kenya',-.02,37.9],['Egypt',26.8,30.8],['South Africa',-30.6,22.9],['Mali',17.6,-4.0],['Sudan',15.5,30.2],['Senegal',14.5,-14.5],['United Kingdom',54,-2],['United States of America',39,-98],['France',46.6,2.2],['Brazil',-14,-52],['India',22.9,79],['China',35,103]];for(const [name,lat,lon] of demoCountries)countryIndex.set(name.toLowerCase(),{name,lat,lon});populateCountries();function populateCountries(){const list=document.querySelector('#countries');list.replaceChildren(...[...countryIndex.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const option=document.createElement('option');option.value=c.name;return option}))}
const cities=[['LAGOS',6.45,3.4,'Nigeria'],['ACCRA',5.56,-.2,'Ghana'],['NAIROBI',-1.29,36.82,'Kenya'],['CAIRO',30.04,31.24,'Egypt'],['JOHANNESBURG',-26.2,28.05,'South Africa']],markers=[];
for(const [name,lat,lon,country] of cities){const m=new T.Mesh(new T.SphereGeometry(.019,12,12),new T.MeshBasicMaterial({color:0xb2cbd0}));m.position.copy(geo(lat,lon,1.045));m.userData={name,country};globe.add(m);markers.push(m)}
const links=[[0,1],[0,2],[1,3],[2,4],[3,4]],travelers=[];for(const [i,j] of links){const a=geo(cities[i][1],cities[i][2],1.025),b=geo(cities[j][1],cities[j][2],1.025),curve=[];for(let k=0;k<=80;k++){const t=k/80;const p=a.clone().lerp(b,t).normalize().multiplyScalar(1.045+Math.sin(t*Math.PI)*.18);curve.push(p)}const line=new T.Line(new T.BufferGeometry().setFromPoints(curve),new T.LineBasicMaterial({color:0x476a73,transparent:true,opacity:.48}));globe.add(line);const dot=new T.Mesh(new T.SphereGeometry(.009,8,8),new T.MeshBasicMaterial({color:0x9cbfc5}));globe.add(dot);travelers.push({dot,curve,offset:i/links.length})}
const canvas=renderer.domElement,ray=new T.Raycaster();let down=false,moved=false,x=0,y=0,spin=true;
function showCard(name,lat,lon,detail){document.querySelector('#place').textContent=name;document.querySelector('#coords').textContent=lat.toFixed(2)+'° N/S · '+lon.toFixed(2)+'° E/W';document.querySelector('#detail').textContent=detail;card.style.display='block';status.textContent='Selected: '+name}
function clearOutline(){if(outline){globe.remove(outline);outline.traverse(o=>{o.geometry?.dispose();o.material?.dispose()});outline=null}}
function highlight(c){clearOutline();if(!c.rings)return;outline=new T.Group();for(const ring of c.rings){if(ring.length<3)continue;const pts=ring.map(([lon,lat])=>geo(lat,lon,1.019));pts.push(pts[0].clone());outline.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:0x9ac6cf,transparent:true,opacity:.95,depthTest:false})))}globe.add(outline)}
function countryDistance(c){if(!c.extent)return 2.05;const latSpan=c.extent.latMax-c.extent.latMin,lonSpan=(c.extent.lonMax-c.extent.lonMin)*Math.cos(c.lat*Math.PI/180);const span=Math.max(latSpan,lonSpan);return T.MathUtils.clamp(1.25+span*.023,1.42,3.1)}
function animateTo(x,y,z){const current=globe.rotation.y,delta=Math.atan2(Math.sin(y-current),Math.cos(y-current));flight={startX:globe.rotation.x,startY:current,endX:x,endY:current+delta,startZ:camera.position.z,endZ:z,start:performance.now(),duration:1750}}
function flyTo(c){if(!c)return;zoomedCountry=c;highlight(c);animateTo(-c.lat*Math.PI/180,Math.PI/2-c.lon*Math.PI/180,countryDistance(c));spin=false;document.querySelector('#spin').textContent='RESUME ROTATION';level.textContent='VIEW: '+c.name.toUpperCase()+' / COUNTRY';showCard(c.name,c.lat,c.lon,'Country-level globe view · Borders shown where geographic data is available. No live feeds connected.')}
function backToGlobe(){zoomedCountry=null;clearOutline();animateTo(.13,-.22,4.6);level.textContent='VIEW: GLOBAL';card.style.display='none';input.value=''}
document.querySelector('#back').onclick=backToGlobe;

function search(){const c=countryIndex.get(input.value.trim().toLowerCase());if(c){flyTo(c);error.textContent=''}else{error.textContent='Country not found. Choose a country from the suggestions.'}}document.querySelector('#go').onclick=search;input.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
function hitMarker(e){ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);return ray.intersectObjects(markers).find(hit=>{const p=hit.object.getWorldPosition(new T.Vector3());return p.z>0&&p.distanceTo(camera.position)<camera.position.length()})}

canvas.addEventListener('pointerdown',e=>{down=true;moved=false;x=e.clientX;y=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-x,dy=e.clientY-y;if(Math.abs(dx)+Math.abs(dy)>1){moved=true;flight=null;}globe.rotation.y+=dx*.005;globe.rotation.x=T.MathUtils.clamp(globe.rotation.x+dy*.005,-1.3,1.3);x=e.clientX;y=e.clientY});canvas.addEventListener('pointermove',e=>{if(down){tooltip.style.display='none';return}const hit=hitMarker(e);tooltip.style.display=hit?'block':'none';if(hit){tooltip.textContent=hit.object.userData.name+' · '+hit.object.userData.country;tooltip.style.left=Math.min(e.clientX+14,innerWidth-190)+'px';tooltip.style.top=Math.min(e.clientY+14,innerHeight-45)+'px'}canvas.style.cursor=hit?'pointer':'grab'});canvas.addEventListener('pointerleave',()=>tooltip.style.display='none');
canvas.addEventListener('pointerup',e=>{down=false;if(moved)return;const hit=hitMarker(e);if(hit){const {name,country}=hit.object.userData;const city=cities.find(c=>c[0]===name);selected=name;showCard(name,city[1],city[2],country+' · Demonstration marker. No live intelligence connected.')}});
canvas.addEventListener('pointercancel',()=>down=false);canvas.addEventListener('wheel',e=>{e.preventDefault();camera.position.z=T.MathUtils.clamp(camera.position.z+e.deltaY*.003,1.28,8)},{passive:false});
function focus(){flight=null;zoomedCountry=null;clearOutline();level.textContent='VIEW: GLOBAL';globe.rotation.set(.13,-.22,0);camera.position.z=4.6;card.style.display='none';input.value=''}focus();
document.querySelector('#reset').onclick=focus;document.querySelector('#spin').onclick=e=>{spin=!spin;e.currentTarget.textContent=spin?'PAUSE ROTATION':'RESUME ROTATION'};document.querySelector('#close').onclick=()=>card.style.display='none';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(time=>{if(flight&&!down){const t=Math.min(1,(performance.now()-flight.start)/flight.duration),ease=t*t*(3-2*t);globe.rotation.x=T.MathUtils.lerp(flight.startX,flight.endX,ease);globe.rotation.y=T.MathUtils.lerp(flight.startY,flight.endY,ease);camera.position.z=T.MathUtils.lerp(flight.startZ,flight.endZ,ease);if(t>=1)flight=null}else if(spin&&!down)globe.rotation.y+=.00042;for(const item of travelers){const idx=Math.floor(((time*.00008+item.offset)%1)*80);item.dot.position.copy(item.curve[idx])}renderer.render(scene,camera)});
}catch(e){error.textContent='Unable to initialise WebGL: '+e.message;console.error(e)}
</script></body></html>
