<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfrOSINT BLACKSITE</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#030506;color:#a8bdc3;font:13px system-ui}#stage{position:fixed;inset:0;touch-action:none}header{position:fixed;top:24px;left:25px;pointer-events:none}h1{font-size:17px;letter-spacing:.22em;color:#d1dadd;margin:0}header p{font-size:11px;letter-spacing:.16em;color:#67858d}aside{position:fixed;bottom:22px;left:25px;padding:14px;background:#080d0fe8;border:1px solid #273b40;border-radius:5px;max-width:calc(100vw - 50px)}button{background:#132024;border:1px solid #334b50;color:#b8c9cd;padding:8px 12px;margin:10px 6px 0 0;cursor:pointer}#card{display:none;position:fixed;right:25px;top:40%;background:#0b1012f2;border:1px solid #354b50;padding:18px;width:240px}#card h2{font-size:16px;letter-spacing:.12em}#card p{line-height:1.6}#close{float:right;margin:0}#error{color:#d99;font-size:11px}footer{position:fixed;right:22px;bottom:20px;color:#567078;font-size:10px;letter-spacing:.1em}@media(max-width:650px){header{left:14px;top:14px}aside{left:14px;bottom:14px}#card{top:auto;bottom:120px;right:14px}footer{display:none}}</style></head><body><div id="stage"></div><header><h1>AFROSINT / BLACKSITE</h1><p>GEOSPATIAL NETWORK · DEMONSTRATION</p></header><aside><div id="status">Drag to rotate · Scroll to zoom · Select a location</div><div id="error" role="alert"></div><button id="reset">FOCUS AFRICA</button><button id="spin">PAUSE ROTATION</button></aside><section id="card"><button id="close">×</button><h2 id="place"></h2><p id="detail"></p></section><footer>BLACKSITE · DIGITAL EARTH · DEMO DATA</footer>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),error=document.querySelector('#error'),card=document.querySelector('#card');
try{
const scene=new T.Scene();scene.background=new T.Color(0x030506);
const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.z=4.6;
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);stage.appendChild(renderer.domElement);
const globe=new T.Group();scene.add(globe);
function geo(lat,lon,r=1){let a=lat*Math.PI/180,b=lon*Math.PI/180;return new T.Vector3(-r*Math.cos(a)*Math.cos(b),r*Math.sin(a),r*Math.cos(a)*Math.sin(b))}
globe.add(new T.LineSegments(new T.WireframeGeometry(new T.IcosahedronGeometry(1.13,2)),new T.LineBasicMaterial({color:0x3a5860,transparent:true,opacity:.27})));
globe.add(new T.Mesh(new T.SphereGeometry(.997,48,32),new T.MeshBasicMaterial({color:0x071014,transparent:true,opacity:.35,depthWrite:false})));
function dots(arr){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(arr,3));globe.add(new T.Points(g,new T.PointsMaterial({color:0x729da6,size:.013,transparent:true,opacity:.85,depthWrite:false})))}
async function land(){const res=await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');if(!res.ok)throw Error('Map data unavailable');const json=await res.json(),canvas=document.createElement('canvas');canvas.width=1440;canvas.height=720;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.fillStyle='white';for(const f of json.features){const g=f.geometry;if(!g)continue;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of polys){ctx.beginPath();for(const ring of poly){ring.forEach(([lon,lat],i)=>{let x=(lon+180)*4,y=(90-lat)*4;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}ctx.fill('evenodd')}}const pix=ctx.getImageData(0,0,1440,720).data,arr=[];for(let y=4;y<716;y+=4)for(let x=4;x<1436;x+=4){if(pix[(y*1440+x)*4+3]<120)continue;const p=geo(90-y/4,x/4-180,1.005);arr.push(p.x,p.y,p.z)}dots(arr);status.textContent='Land network ready · Drag to rotate · Select a location'}
land().catch(e=>{error.textContent='Map source unavailable; displaying fallback network';console.warn(e);const a=[];for(let lat=-88;lat<=88;lat+=4)for(let lon=-180;lon<180;lon+=4){const p=geo(lat,lon,1.005);a.push(p.x,p.y,p.z)}dots(a)});
const cities=[['LAGOS',6.45,3.4,'Nigeria'],['ACCRA',5.56,-.2,'Ghana'],['NAIROBI',-1.29,36.82,'Kenya'],['CAIRO',30.04,31.24,'Egypt'],['JOHANNESBURG',-26.2,28.05,'South Africa']],markers=[];
for(const [name,lat,lon,country] of cities){const m=new T.Mesh(new T.SphereGeometry(.019,12,12),new T.MeshBasicMaterial({color:0xb2cbd0}));m.position.copy(geo(lat,lon,1.045));m.userData={name,country};globe.add(m);markers.push(m)}
const canvas=renderer.domElement,ray=new T.Raycaster();let down=false,moved=false,x=0,y=0,spin=true;
canvas.addEventListener('pointerdown',e=>{down=true;moved=false;x=e.clientX;y=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-x,dy=e.clientY-y;if(Math.abs(dx)+Math.abs(dy)>1)moved=true;globe.rotation.y+=dx*.005;globe.rotation.x=T.MathUtils.clamp(globe.rotation.x+dy*.005,-1.3,1.3);x=e.clientX;y=e.clientY});
canvas.addEventListener('pointerup',e=>{down=false;if(moved)return;ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);const hit=ray.intersectObjects(markers)[0];if(hit){const {name,country}=hit.object.userData;document.querySelector('#place').textContent=name;document.querySelector('#detail').textContent=country+' · Demonstration marker. No live intelligence connected.';card.style.display='block';status.textContent='Selected: '+name}});
canvas.addEventListener('pointercancel',()=>down=false);canvas.addEventListener('wheel',e=>{e.preventDefault();camera.position.z=T.MathUtils.clamp(camera.position.z+e.deltaY*.003,2.7,8)},{passive:false});
function focus(){globe.rotation.set(.13,-.22,0);camera.position.z=4.6;card.style.display='none'}focus();
document.querySelector('#reset').onclick=focus;document.querySelector('#spin').onclick=e=>{spin=!spin;e.currentTarget.textContent=spin?'PAUSE ROTATION':'RESUME ROTATION'};document.querySelector('#close').onclick=()=>card.style.display='none';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{if(spin&&!down)globe.rotation.y+=.00042;renderer.render(scene,camera)});
}catch(e){error.textContent='Unable to initialise WebGL: '+e.message;console.error(e)}
</script></body></html>
