name: Validate globe
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HTML structure and module syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('index.html','utf8');
          assert.match(html, /<div id="stage"/);
          assert.match(html, /<script type="module">/);
          assert.match(html, /AFROSINT \/ BLACKSITE/);
          assert.match(html, /WireframeGeometry/);
          const match = html.match(/<script type="module">([\s\S]*?)<\/script>/);
          assert.ok(match, 'ES module script must exist');
          fs.writeFileSync('/tmp/globe-check.mjs', match[1]);
          const check = spawnSync(process.execPath, ['--check','/tmp/globe-check.mjs'], {stdio:'inherit'});
          assert.equal(check.status,0,'JavaScript syntax check failed');
          NODE
